name: Build Production Frontend

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
      NEXT_PUBLIC_PAYMENTS_ENABLED: ${{ vars.NEXT_PUBLIC_PAYMENTS_ENABLED }}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate production configuration
        run: |
          node -e '
          const required = [
            "NEXT_PUBLIC_API_URL",
            "NEXT_PUBLIC_PAYMENTS_ENABLED",
            "NEXT_PUBLIC_RAZORPAY_KEY_ID"
          ];
          const missing = required.filter(
            key => !process.env[key]
          );
          if (missing.length) {
            console.error("Missing GitHub Actions variables:", missing.join(", "));
            process.exit(1);
          }
          const api = new URL(process.env.NEXT_PUBLIC_API_URL);
          if (
            api.protocol !== "https:" ||
            !["theholymatrimony.com", "www.theholymatrimony.com"].includes(api.hostname) ||
            api.pathname !== "/api/v1"
          ) {
            console.error("Unexpected production API URL configuration.");
            process.exit(1);
          }
          console.log("Production configuration validated.");
          '

      - name: Build frontend
        run: npm run build

      - name: Package Linux build
        run: |
          tar -czf "$RUNNER_TEMP/frontend-linux.tar.gz" \
            .next \
            package.json \
            package-lock.json \
            next.config.ts \
            public

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-linux-${{ github.sha }}
          path: ${{ runner.temp }}/frontend-linux.tar.gz
          retention-days: 7
