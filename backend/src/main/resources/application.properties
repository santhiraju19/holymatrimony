#########################################################
# Application
#########################################################
spring.application.name=holy-matrimony-backend
server.port=${SERVER_PORT:8080}

#########################################################
# PostgreSQL
#########################################################
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/holymatrimony}
spring.datasource.username=${DATABASE_USERNAME:hm_user}
spring.datasource.password=${DATABASE_PASSWORD:Hm@2026Secure}
spring.datasource.driver-class-name=org.postgresql.Driver

#########################################################
# Connection Pool
#########################################################
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

#########################################################
# JPA
#########################################################
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#########################################################
# Flyway
#########################################################
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:4}

#########################################################
# JWT
#########################################################
jwt.secret=${JWT_SECRET:HolyMatrimonyDevelopmentSecretKey2026ChangeBeforeProduction123456789}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

#########################################################
# Verification SMTP Account
#########################################################
app.mail.verify.host=smtp.gmail.com
app.mail.verify.port=587

app.mail.verify.username=verify@theholymatrimony.com
app.mail.verify.password=npnfbtoscufkjnft

app.mail.verify.from=verify@theholymatrimony.com
app.mail.verify.from-name=Holy Matrimony

