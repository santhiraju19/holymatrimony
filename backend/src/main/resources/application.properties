#########################################################
# Application
#########################################################
spring.application.name=holy-matrimony-backend
server.port=${SERVER_PORT:8080}

#########################################################
# PostgreSQL
#########################################################
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/holymatrimony}
spring.datasource.username=${DATABASE_USERNAME:hm_user}
spring.datasource.password=${DATABASE_PASSWORD:Hm@2026Secure}
spring.datasource.driver-class-name=org.postgresql.Driver

#########################################################
# JPA
#########################################################
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false

#########################################################
# Flyway
#########################################################
spring.flyway.enabled=${FLYWAY_ENABLED:false}

#########################################################
# JWT
#########################################################
jwt.secret=${JWT_SECRET:HolyMatrimonySecureSecretKey2026HolyMatrimonySecureSecretKey}
jwt.expiration=${JWT_EXPIRATION:86400000}

#########################################################
# Mail (Safe Defaults)
#########################################################
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:test}
spring.mail.password=${MAIL_PASSWORD:test}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#########################################################
# Application URLs
#########################################################
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.backend.url=${BACKEND_URL:http://localhost:8080}

#########################################################
# Logging
#########################################################
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:WARN}

#########################################################
# Error Handling
#########################################################
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=${ERROR_STACKTRACE:always}