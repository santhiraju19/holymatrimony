#########################################################
# Application
#########################################################
spring.application.name=holy-matrimony-backend
server.port=${SERVER_PORT:8080}

#########################################################
# PostgreSQL
#########################################################
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/holymatrimony}
spring.datasource.username=${DATABASE_USERNAME:hm_user}
spring.datasource.password=${DATABASE_PASSWORD:Hm@2026Secure}
spring.datasource.driver-class-name=org.postgresql.Driver

#########################################################
# Connection Pool
#########################################################
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

#########################################################
# JPA
#########################################################
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#########################################################
# Flyway
#########################################################
spring.flyway.enabled=${FLYWAY_ENABLED:false}

#########################################################
# JWT
#########################################################
# Never commit the production JWT secret.
# Production must provide JWT_SECRET as an environment variable.
jwt.secret=${JWT_SECRET:HolyMatrimonyDevelopmentSecretKey2026ChangeBeforeProduction123456789}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

#########################################################
# Mail
#########################################################
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:test}
spring.mail.password=${MAIL_PASSWORD:test}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}

#########################################################
# Application URLs
#########################################################
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.backend.url=${BACKEND_URL:http://localhost:8080}

#########################################################
# Razorpay
#########################################################
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

#########################################################
# Logging
#########################################################
logging.level.root=${ROOT_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:WARN}
logging.level.com.theholymatrimony.backend=${APPLICATION_LOG_LEVEL:INFO}

#########################################################
# Error Handling
#########################################################
server.error.include-message=${ERROR_INCLUDE_MESSAGE:never}
server.error.include-binding-errors=${ERROR_INCLUDE_BINDING_ERRORS:never}
server.error.include-stacktrace=${ERROR_INCLUDE_STACKTRACE:never}
server.error.include-exception=false

#########################################################
# Jackson
#########################################################
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

#########################################################
# Development
#########################################################
spring.devtools.restart.enabled=${DEVTOOLS_RESTART_ENABLED:false}

# Profile photo upload
app.upload.profile-photos-directory=uploads/profile-photos
app.upload.profile-photos-url=/uploads/profile-photos

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

app.upload.profile-photos-directory=uploads/profile-photos
app.upload.profile-photos-url=/uploads/profile-photos