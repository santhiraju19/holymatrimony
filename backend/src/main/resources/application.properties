#########################################################
# Spring Mail Compatibility
#########################################################
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=verify@theholymatrimony.com
spring.mail.password=npnfbtoscufkjnft

spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

#########################################################
# General Sender Compatibility
#########################################################
app.mail.from=verify@theholymatrimony.com
app.mail.from-name=Holy Matrimony

#########################################################
# SMTP Diagnostics
#########################################################
spring.mail.properties.mail.debug=true
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.mail.javamail=DEBUG

#########################################################
# Application URLs
#########################################################
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.backend.url=${BACKEND_URL:http://localhost:8080}

#########################################################
# Razorpay
#########################################################
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

#########################################################
# Payments
#########################################################
payments.enabled=${PAYMENTS_ENABLED:false}

#########################################################
# Profile Photo Upload
#########################################################
app.upload.profile-photos-directory=${PROFILE_PHOTOS_DIRECTORY:uploads/profile-photos}
app.upload.profile-photos-url=${PROFILE_PHOTOS_URL:/api/v1/uploads/profile-photos}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

#########################################################
# Chat Media Upload
#########################################################
app.upload.chat-media-directory=${CHAT_MEDIA_DIRECTORY:uploads/chat-media}
app.upload.chat-media-url=${CHAT_MEDIA_URL:/api/v1/uploads/chat-media}

#########################################################
# Logging
#########################################################
logging.level.root=${ROOT_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:WARN}
logging.level.com.theholymatrimony.backend=${APPLICATION_LOG_LEVEL:INFO}

#########################################################
# Error Handling
#########################################################
server.error.include-message=${ERROR_INCLUDE_MESSAGE:always}
server.error.include-binding-errors=${ERROR_INCLUDE_BINDING_ERRORS:always}
server.error.include-stacktrace=${ERROR_INCLUDE_STACKTRACE:on_param}
server.error.include-exception=false

#########################################################
# Jackson
#########################################################
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

#########################################################
# Development
#########################################################
spring.devtools.restart.enabled=${DEVTOOLS_RESTART_ENABLED:false}

payments.cleanup.cron=${PAYMENTS_CLEANUP_CRON:0 15 3 * * *}
payments.cleanup.zone=${PAYMENTS_CLEANUP_ZONE:Asia/Kolkata}


#########################################################
# SMS
#########################################################
sms.provider=${SMS_PROVIDER:disabled}

#########################################################
# AWS End User Messaging SMS
#########################################################
sms.aws.region=${AWS_SMS_REGION:ap-south-1}
sms.aws.sender-id=${AWS_SMS_SENDER_ID:}
sms.aws.entity-id=${AWS_SMS_ENTITY_ID:}
sms.aws.template-id=${AWS_SMS_TEMPLATE_ID:}

#########################################################
# Private Identity Verification Documents
#########################################################
app.upload.identity-documents-directory=${IDENTITY_DOCUMENTS_DIRECTORY:uploads/private/identity-documents}

#########################################################
# Private Church Verification Proofs
#########################################################
app.upload.church-proofs-directory=${CHURCH_PROOFS_DIRECTORY:uploads/private/church-proofs}